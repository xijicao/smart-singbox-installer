<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1120" viewBox="0 0 1800 1120">
  <defs>
    <style>
      .bg { fill: #f7f4ea; }
      .root { fill: #17252a; }
      .rootText { fill: #fffaf0; font: 700 34px 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif; }
      .section { fill: #ffffff; stroke: #263238; stroke-width: 3; }
      .sectionTitle { fill: #102027; font: 700 28px 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif; }
      .card { fill: #fbf7ec; stroke: #465a69; stroke-width: 2; }
      .card2 { fill: #eef7f1; stroke: #3d6b52; stroke-width: 2; }
      .card3 { fill: #eef4fb; stroke: #3f5f86; stroke-width: 2; }
      .card4 { fill: #fff1ee; stroke: #9b4b3d; stroke-width: 2; }
      .label { fill: #1f2d33; font: 700 23px 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif; }
      .text { fill: #233238; font: 20px 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif; }
      .small { fill: #42515a; font: 18px 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif; }
      .cmd { fill: #0f3b57; font: 700 19px Consolas, 'Microsoft YaHei', monospace; }
      .line { stroke: #465a69; stroke-width: 3; fill: none; }
      .dash { stroke: #8a6f3f; stroke-width: 3; fill: none; stroke-dasharray: 10 8; }
      .note { fill: #fff8da; stroke: #8a6f3f; stroke-width: 2; }
      .pill { fill: #263238; }
      .pillText { fill: #fff; font: 700 18px 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif; }
    </style>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#465a69" />
    </marker>
    <marker id="arrowGold" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#8a6f3f" />
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1800" height="1120" />

  <rect class="root" x="510" y="36" rx="28" ry="28" width="780" height="88" />
  <text class="rootText" x="900" y="92" text-anchor="middle">GitHub 一行命令部署 sing-box 节点体系</text>

  <path class="line" marker-end="url(#arrow)" d="M900 124 C900 165, 330 165, 330 205" />
  <path class="line" marker-end="url(#arrow)" d="M900 124 C900 165, 900 165, 900 205" />
  <path class="line" marker-end="url(#arrow)" d="M900 124 C900 165, 1470 165, 1470 205" />

  <!-- Left section -->
  <rect class="section" x="70" y="205" rx="26" ry="26" width="520" height="795" />
  <text class="sectionTitle" x="330" y="255" text-anchor="middle">入口机器：DMIT / HK</text>
  <rect class="pill" x="197" y="275" rx="17" ry="17" width="266" height="36" />
  <text class="pillText" x="330" y="300" text-anchor="middle">客户端主要导入这里</text>

  <rect class="card3" x="110" y="340" rx="22" ry="22" width="440" height="225" />
  <text class="label" x="135" y="380">DMIT Debian 12</text>
  <text class="text" x="135" y="420">• 2G 带宽，双栈，日常主力</text>
  <text class="text" x="135" y="455">• 安装后吐出 2 个 Reality 链接</text>
  <text class="small" x="164" y="487">me / friend</text>
  <text class="text" x="135" y="523">• 可粘贴 ss:// 生成中转 Reality</text>

  <rect class="card3" x="110" y="600" rx="22" ry="22" width="440" height="245" />
  <text class="label" x="135" y="640">HK Debian 12</text>
  <text class="text" x="135" y="680">• 10Mbps 小水管，IPv4 单栈</text>
  <text class="text" x="135" y="715">• 安装后吐出 2 个 Reality 链接</text>
  <text class="small" x="164" y="747">me-direct / friend-direct</text>
  <text class="text" x="135" y="783">• 国际互联中心，中转各地落地</text>
  <text class="small" x="164" y="815">JP / TW / US / EU home</text>

  <rect class="note" x="110" y="880" rx="18" ry="18" width="440" height="78" />
  <text class="cmd" x="135" y="914">sing-box-add-ss2022-relay</text>
  <text class="small" x="135" y="944">在 DMIT/HK 上粘贴 ss://，返回 vless:// 中转链接</text>

  <!-- Middle section -->
  <rect class="section" x="640" y="205" rx="26" ry="26" width="520" height="795" />
  <text class="sectionTitle" x="900" y="255" text-anchor="middle">落地 / 中转机器：home</text>
  <rect class="pill" x="723" y="275" rx="17" ry="17" width="354" height="36" />
  <text class="pillText" x="900" y="300" text-anchor="middle">家宽 / LXC / NAT / IPLC 都归这里</text>

  <rect class="card2" x="680" y="340" rx="22" ry="22" width="440" height="145" />
  <text class="label" x="705" y="380">菜单 3：只装 SS2022</text>
  <text class="text" x="705" y="420">• 家宽、NAT、LXC、IPLC 落地</text>
  <text class="text" x="705" y="455">• 输出 ss_link 给 DMIT/HK 导入</text>

  <rect class="card2" x="680" y="515" rx="22" ry="22" width="440" height="125" />
  <text class="label" x="705" y="555">菜单 4：Reality + SS2022</text>
  <text class="text" x="705" y="595">• 直连质量好就这样装</text>
  <text class="text" x="705" y="625">• 自动识别 Debian/Alpine</text>

  <rect class="card" x="680" y="675" rx="22" ry="22" width="440" height="260" />
  <text class="label" x="705" y="715">端口和链接怎么处理</text>
  <text class="text" x="705" y="755">• ss2022：只做落地</text>
  <text class="small" x="735" y="785">输出 ss_link，给 DMIT/HK 导入</text>
  <text class="text" x="705" y="822">• reality：只做直连</text>
  <text class="small" x="735" y="852">输出 vless Reality 链接</text>
  <text class="text" x="705" y="889">• both：直连 + 落地</text>
  <text class="small" x="735" y="919">同时输出 vless 和 ss_link</text>

  <!-- Right section -->
  <rect class="section" x="1210" y="205" rx="26" ry="26" width="520" height="795" />
  <text class="sectionTitle" x="1470" y="255" text-anchor="middle">后续维护：sb / -sb</text>
  <rect class="pill" x="1308" y="275" rx="17" ry="17" width="324" height="36" />
  <text class="pillText" x="1470" y="300" text-anchor="middle">只在 DMIT/HK 上运行</text>

  <rect class="card4" x="1250" y="340" rx="22" ry="22" width="440" height="150" />
  <text class="label" x="1275" y="380">1. 重置基础节点</text>
  <text class="text" x="1275" y="420">• 重新生成 me / friend UUID</text>
  <text class="text" x="1275" y="455">• 重新生成 short_id 并输出新链接</text>

  <rect class="card4" x="1250" y="525" rx="22" ry="22" width="440" height="185" />
  <text class="label" x="1275" y="565">2 / 3. 管理落地中转</text>
  <text class="text" x="1275" y="605">• 列出所有 relay-* 节点</text>
  <text class="text" x="1275" y="640">• 选择编号删除不用的家宽落地</text>
  <text class="small" x="1275" y="675">删除 Reality 用户 + outbound + route</text>

  <rect class="card4" x="1250" y="745" rx="22" ry="22" width="440" height="150" />
  <text class="label" x="1275" y="785">4. 查看当前链接</text>
  <text class="text" x="1275" y="825">• 输出所有 Reality 链接</text>
  <text class="small" x="1275" y="860">只查看，不修改配置</text>

  <rect class="note" x="1250" y="920" rx="18" ry="18" width="440" height="58" />
  <text class="cmd" x="1275" y="956">命令：sb    或    -sb</text>

  <rect class="note" x="1250" y="992" rx="18" ry="18" width="440" height="72" />
  <text class="small" x="1275" y="1022">扩展：5备份 / 6恢复 / 7更新 core</text>
  <text class="small" x="1275" y="1052">home 卸载：sing-box-uninstall</text>

  <!-- Flow arrows bottom -->
  <path class="dash" marker-end="url(#arrowGold)" d="M900 935 C900 1040, 330 1040, 330 960" />
  <text class="small" x="600" y="1065" text-anchor="middle">home 输出 ss_link → DMIT/HK 粘贴导入 → 生成 vless 中转节点</text>

  <path class="dash" marker-end="url(#arrowGold)" d="M1470 920 C1470 1045, 1060 1045, 1060 935" />
  <text class="small" x="1325" y="1065" text-anchor="middle">不想用某个落地 → sb 选择删除 relay</text>
</svg>
