<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1720" viewBox="0 0 2400 1720">
  <defs>
    <style>
      .bg { fill: #f5f1e6; }
      .titleBox { fill: #102027; }
      .title { fill: #fffaf0; font: 800 42px 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif; }
      .subtitle { fill: #f9e9b7; font: 22px 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif; }
      .section { fill: #ffffff; stroke: #263238; stroke-width: 3.5; }
      .sectionTitle { fill: #102027; font: 800 30px 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif; }
      .card { fill: #fbf7ec; stroke: #52616b; stroke-width: 2.4; }
      .blue { fill: #edf5ff; stroke: #3f5f86; stroke-width: 2.4; }
      .green { fill: #eef8f0; stroke: #3d6b52; stroke-width: 2.4; }
      .orange { fill: #fff2e8; stroke: #9a5b28; stroke-width: 2.4; }
      .red { fill: #fff0ef; stroke: #974b42; stroke-width: 2.4; }
      .yellow { fill: #fff9dc; stroke: #8a6f3f; stroke-width: 2.4; }
      .gray { fill: #f1f3f4; stroke: #65737e; stroke-width: 2.4; }
      .label { fill: #15252c; font: 800 25px 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif; }
      .text { fill: #203038; font: 21px 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif; }
      .small { fill: #40505a; font: 18px 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif; }
      .cmd { fill: #0d3a5c; font: 800 19px Consolas, 'Microsoft YaHei', monospace; }
      .ok { fill: #166534; font: 800 20px 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif; }
      .warn { fill: #8a4b00; font: 800 20px 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif; }
      .line { stroke: #455a64; stroke-width: 3.2; fill: none; }
      .flow { stroke: #8a6f3f; stroke-width: 3.2; fill: none; stroke-dasharray: 11 8; }
      .thin { stroke: #78909c; stroke-width: 2; fill: none; }
      .pill { fill: #263238; }
      .pillText { fill: #fff; font: 800 17px 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif; }
      .num { fill: #102027; font: 900 24px 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif; }
    </style>
    <marker id="arrow" markerWidth="13" markerHeight="13" refX="11" refY="6.5" orient="auto">
      <path d="M2,2 L11,6.5 L2,11 Z" fill="#455a64" />
    </marker>
    <marker id="arrowGold" markerWidth="13" markerHeight="13" refX="11" refY="6.5" orient="auto">
      <path d="M2,2 L11,6.5 L2,11 Z" fill="#8a6f3f" />
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="2400" height="1720" />

  <rect class="titleBox" x="380" y="34" rx="30" ry="30" width="1640" height="118" />
  <text class="title" x="1200" y="88" text-anchor="middle">sing-box GitHub 一键部署完整树状图</text>
  <text class="subtitle" x="1200" y="126" text-anchor="middle">目标：一行命令安装，自动识别 Debian/Alpine，输出链接，DMIT/HK 可粘贴 ss:// 生成 Reality 中转，并支持 sb 管理删除</text>

  <!-- Root lines -->
  <path class="line" marker-end="url(#arrow)" d="M1200 152 C1200 205, 335 205, 335 250" />
  <path class="line" marker-end="url(#arrow)" d="M1200 152 C1200 205, 880 205, 880 250" />
  <path class="line" marker-end="url(#arrow)" d="M1200 152 C1200 205, 1435 205, 1435 250" />
  <path class="line" marker-end="url(#arrow)" d="M1200 152 C1200 205, 2035 205, 2035 250" />

  <!-- Requirement coverage -->
  <rect class="section" x="70" y="250" rx="28" ry="28" width="530" height="575" />
  <text class="sectionTitle" x="335" y="303" text-anchor="middle">需求覆盖情况</text>

  <rect class="green" x="110" y="335" rx="18" ry="18" width="450" height="64" />
  <text class="ok" x="135" y="374">满足 1：每台机器安装完吐出链接</text>

  <rect class="green" x="110" y="420" rx="18" ry="18" width="450" height="86" />
  <text class="ok" x="135" y="456">满足 2：无需上传文件</text>
  <text class="small" x="135" y="485">SSH 里一行 curl 命令自动拉 GitHub 脚本</text>

  <rect class="green" x="110" y="527" rx="18" ry="18" width="450" height="86" />
  <text class="ok" x="135" y="563">满足 3：自动识别系统</text>
  <text class="small" x="135" y="592">Debian/Ubuntu 与 Alpine 自动分流</text>

  <rect class="green" x="110" y="634" rx="18" ry="18" width="450" height="86" />
  <text class="ok" x="135" y="670">满足 4：DMIT/HK 粘贴 ss:// 导入</text>
  <text class="small" x="135" y="699">自动返回对应 vless:// Reality 中转链接</text>

  <rect class="green" x="110" y="741" rx="18" ry="18" width="450" height="56" />
  <text class="ok" x="135" y="776">满足 5：sb/-sb 管理删除和重置</text>

  <!-- Entry machines -->
  <rect class="section" x="650" y="250" rx="28" ry="28" width="460" height="575" />
  <text class="sectionTitle" x="880" y="303" text-anchor="middle">入口机器</text>
  <rect class="pill" x="735" y="322" rx="18" ry="18" width="290" height="36" />
  <text class="pillText" x="880" y="347" text-anchor="middle">客户端主要导入这里</text>

  <rect class="blue" x="690" y="382" rx="22" ry="22" width="380" height="170" />
  <text class="label" x="715" y="420">DMIT Debian 12</text>
  <text class="text" x="715" y="458">• 2G 带宽，双栈</text>
  <text class="text" x="715" y="492">• 主力 Reality 入口</text>
  <text class="text" x="715" y="526">• 默认输出 me / friend 两条链接</text>

  <rect class="blue" x="690" y="585" rx="22" ry="22" width="380" height="190" />
  <text class="label" x="715" y="623">HK Debian 12</text>
  <text class="text" x="715" y="661">• 10Mbps，IPv4 单栈</text>
  <text class="text" x="715" y="695">• 主力入口 + 国际互联中心</text>
  <text class="text" x="715" y="729">• 默认输出 me-direct / friend-direct</text>
  <text class="small" x="715" y="758">后续接 JP/TW/US/EU 落地</text>

  <!-- Landing machines -->
  <rect class="section" x="1190" y="250" rx="28" ry="28" width="490" height="575" />
  <text class="sectionTitle" x="1435" y="303" text-anchor="middle">落地 / 中转机器</text>
  <rect class="pill" x="1240" y="322" rx="18" ry="18" width="390" height="36" />
  <text class="pillText" x="1435" y="347" text-anchor="middle">家宽 / LXC / NAT / IPLC 都归 home</text>

  <rect class="green" x="1230" y="382" rx="22" ry="22" width="410" height="128" />
  <text class="label" x="1255" y="420">自动识别系统</text>
  <text class="text" x="1255" y="458">• Debian / Ubuntu → home-debian</text>
  <text class="text" x="1255" y="492">• Alpine → home-alpine</text>

  <rect class="green" x="1230" y="540" rx="22" ry="22" width="410" height="245" />
  <text class="label" x="1255" y="578">安装模式选择</text>
  <text class="text" x="1255" y="616">• ss2022：只做落地</text>
  <text class="small" x="1285" y="646">输出 ss_link，给 DMIT/HK 导入</text>
  <text class="text" x="1255" y="682">• reality：只做直连</text>
  <text class="small" x="1285" y="712">输出 vless Reality 链接</text>
  <text class="text" x="1255" y="748">• both：直连 + 落地都装</text>
  <text class="small" x="1285" y="775">both 模式两个协议必须不同端口</text>

  <!-- Download logic -->
  <rect class="section" x="1770" y="250" rx="28" ry="28" width="560" height="575" />
  <text class="sectionTitle" x="2050" y="303" text-anchor="middle">下载与安装逻辑</text>

  <rect class="yellow" x="1810" y="345" rx="20" ry="20" width="480" height="120" />
  <text class="label" x="1835" y="385">Debian / Ubuntu</text>
  <text class="cmd" x="1835" y="424">glibc 包 → 通用包</text>
  <text class="small" x="1835" y="452">不再尝试 Alpine 的 musl 包</text>

  <rect class="yellow" x="1810" y="495" rx="20" ry="20" width="480" height="120" />
  <text class="label" x="1835" y="535">Alpine</text>
  <text class="cmd" x="1835" y="574">musl 包 → 通用包</text>
  <text class="small" x="1835" y="602">不再尝试 Debian 的 glibc 包</text>

  <rect class="gray" x="1810" y="645" rx="20" ry="20" width="480" height="112" />
  <text class="label" x="1835" y="685">版本</text>
  <text class="text" x="1835" y="724">默认 latest，可用 SINGBOX_VERSION 锁定</text>

  <!-- Commands row -->
  <rect class="section" x="70" y="885" rx="28" ry="28" width="2260" height="305" />
  <text class="sectionTitle" x="1200" y="935" text-anchor="middle">一条命令 + 固定菜单</text>

  <rect class="card" x="110" y="970" rx="18" ry="18" width="520" height="170" />
  <text class="num" x="135" y="1008">1. 先跑唯一命令</text>
  <text class="cmd" x="135" y="1046">curl .../install.sh | sh</text>
  <text class="cmd" x="135" y="1080">wget -qO- .../install.sh | sh</text>
  <text class="small" x="135" y="1116">没有 curl 时用 wget 备用</text>

  <rect class="card" x="670" y="970" rx="18" ry="18" width="560" height="170" />
  <text class="num" x="695" y="1008">2. 菜单选择安装类型</text>
  <text class="cmd" x="695" y="1046">1 DMIT入口 / 2 HK入口</text>
  <text class="cmd" x="695" y="1080">3 SS2022 / 4 Reality+SS2022</text>
  <text class="small" x="695" y="1116">home 自动识别 Debian/Alpine</text>

  <rect class="card" x="1270" y="970" rx="18" ry="18" width="480" height="170" />
  <text class="num" x="1295" y="1008">3. 复制 ss_link</text>
  <text class="cmd" x="1295" y="1046">cat /root/home-singbox-info.txt</text>
  <text class="small" x="1295" y="1084">复制里面的 ss://...</text>
  <text class="small" x="1295" y="1116">给 DMIT 或 HK 导入</text>
  <text class="small" x="1295" y="1138">NAT：ss:// 写公网端口</text>

  <rect class="card" x="1790" y="970" rx="18" ry="18" width="500" height="170" />
  <text class="num" x="1815" y="1008">4. 入口机生成中转链接</text>
  <text class="cmd" x="1815" y="1046">sing-box-add-ss2022-relay</text>
  <text class="small" x="1815" y="1084">粘贴 ss://，自动输出 vless://</text>
  <text class="small" x="1815" y="1116">得到 DMIT/HK-relay-xxx 节点</text>

  <path class="flow" marker-end="url(#arrowGold)" d="M630 1055 L670 1055" />
  <path class="flow" marker-end="url(#arrowGold)" d="M1230 1055 L1270 1055" />
  <path class="flow" marker-end="url(#arrowGold)" d="M1750 1055 L1790 1055" />

  <!-- Management section -->
  <rect class="section" x="70" y="1245" rx="28" ry="28" width="2260" height="420" />
  <text class="sectionTitle" x="1200" y="1295" text-anchor="middle">后续统一管理：sb 或 -sb</text>

  <rect class="red" x="110" y="1340" rx="20" ry="20" width="520" height="210" />
  <text class="label" x="135" y="1380">1. 重置基础节点</text>
  <text class="text" x="135" y="1420">• 重新生成 me / friend UUID</text>
  <text class="text" x="135" y="1454">• 重新生成 short_id</text>
  <text class="text" x="135" y="1488">• 输出新的 vless 链接</text>
  <text class="small" x="135" y="1525">默认不动已导入的 relay 落地节点</text>

  <rect class="red" x="670" y="1340" rx="20" ry="20" width="520" height="210" />
  <text class="label" x="695" y="1380">2. 列出落地中转</text>
  <text class="text" x="695" y="1420">• 列出所有 relay-* Reality 节点</text>
  <text class="text" x="695" y="1454">• 方便确认当前有哪些家宽落地</text>
  <text class="small" x="695" y="1495">例如 relay-jp-home / relay-tw-home</text>

  <rect class="red" x="1230" y="1340" rx="20" ry="20" width="520" height="210" />
  <text class="label" x="1255" y="1380">3. 删除落地中转</text>
  <text class="text" x="1255" y="1420">• 按编号选择删除</text>
  <text class="text" x="1255" y="1454">• 删除 Reality 用户 + outbound + route</text>
  <text class="small" x="1255" y="1495">修改前自动备份 config.json</text>

  <rect class="red" x="1790" y="1340" rx="20" ry="20" width="500" height="210" />
  <text class="label" x="1815" y="1380">4. 查看当前链接</text>
  <text class="text" x="1815" y="1420">• 输出所有 Reality 链接</text>
  <text class="text" x="1815" y="1454">• 方便重新复制到客户端</text>
  <text class="small" x="1815" y="1495">不修改配置，安全查看</text>

  <rect class="yellow" x="670" y="1568" rx="18" ry="18" width="1060" height="70" />
  <text class="label" x="700" y="1608">维护扩展</text>
  <text class="small" x="840" y="1608">5 备份 config/meta · 6 恢复最新备份 · 7 只更新 sing-box core · home 可 sing-box-uninstall · GitHub Actions 跑自检</text>

  <!-- Main flow arrows between sections -->
  <path class="flow" marker-end="url(#arrowGold)" d="M1435 825 C1435 855, 1435 855, 1435 885" />
  <path class="flow" marker-end="url(#arrowGold)" d="M880 825 C880 855, 880 855, 880 885" />
  <path class="line" marker-end="url(#arrow)" d="M1435 825 C1435 860, 2050 860, 2050 970" />
  <text class="small" x="1740" y="858">home 机器输出 ss_link</text>
  <path class="line" marker-end="url(#arrow)" d="M2050 1140 C2050 1210, 1490 1210, 1490 1340" />
  <text class="small" x="1815" y="1220">后续不用了，从 sb 删除；维护用 5/6/7</text>
</svg>
